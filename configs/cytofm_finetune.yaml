architecture: "cytofm"
num_classes: 2
pretrained: true

model_params:
  checkpoint_path: "models/cytofm_weights.pth"
  head_hidden_dim: 256
  dropout: 0.1

training_mode: "fine_tune"

batch_size: 32
num_epochs: 50
learning_rate: 0.0001
optimizer: "adamw"
optimizer_params:
  weight_decay: 0.01
loss_function: "cross_entropy"

k_folds: 5
random_seed: 42
